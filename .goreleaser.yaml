# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

git:
  ignore_tags:
    - nightly
    - ".*-nightly.*"

before:
  hooks:
    - go generate ./...
    - sh -c 'cd web/frontend && bun install --frozen-lockfile && bun run build:backend'

builds:
  - id: gogoclaw
    main: ./cmd/gogoclaw
    binary: gogoclaw
    env:
      - CGO_ENABLED=0
    tags:
      - goolm
      - stdjson
      - whatsapp_native
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/biaobiaobiao108/gogoclaw/pkg/config.Version={{ .Version }}
      - -X github.com/biaobiaobiao108/gogoclaw/pkg/config.GitCommit={{ .ShortCommit }}
      - -X github.com/biaobiaobiao108/gogoclaw/pkg/config.BuildTime={{ .Date }}
      - -X github.com/biaobiaobiao108/gogoclaw/pkg/config.GoVersion={{ with index .Env "GOVERSION" }}{{ . }}{{ else }}unknown{{ end }}

  - id: gogoclaw-launcher
    main: ./web/backend
    binary: gogoclaw-launcher
    env:
      - CGO_ENABLED=0
    tags:
      - goolm
      - stdjson
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/biaobiaobiao108/gogoclaw/pkg/config.Version={{ .Version }}
      - -X github.com/biaobiaobiao108/gogoclaw/pkg/config.GitCommit={{ .ShortCommit }}
      - -X github.com/biaobiaobiao108/gogoclaw/pkg/config.BuildTime={{ .Date }}
      - -X github.com/biaobiaobiao108/gogoclaw/pkg/config.GoVersion={{ with index .Env "GOVERSION" }}{{ . }}{{ else }}unknown{{ end }}

dockers_v2:
  - id: gogoclaw
    dockerfile: docker/Dockerfile.goreleaser
    extra_files:
      - docker/entrypoint.sh
    ids:
      - gogoclaw
      - gogoclaw-launcher
    images:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/gogoclaw"
      - "docker.io/{{ .Env.DOCKERHUB_IMAGE_NAME }}"
    tags:
      - '{{ if isEnvSet "NIGHTLY_BUILD" }}nightly{{ else }}{{ .Tag }}{{ end }}'
      - '{{ if isEnvSet "NIGHTLY_BUILD" }}nightly{{ else }}latest{{ end }}'
    platforms:
      - linux/amd64
      - linux/arm64

archives: []

checksum:
  disable: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  disable: '{{ isEnvSet "NIGHTLY_BUILD" }}'
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
