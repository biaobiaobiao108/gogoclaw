name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet -tags goolm,stdjson ./...
      - run: go test -tags goolm,stdjson ./...
      - run: go test -race -tags goolm,stdjson ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  harness:
    name: agent scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make harness-test

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker compose version
      - run: make integration-test

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # No patched picomatch release exists yet (GHSA-fc5q-39xc-vjpf).
      # It is used by frontend build tooling, not shipped in the runtime image.
      # Fail when the latest release changes so this exception is reassessed.
      - name: Audit dependencies
        run: |
          if [ "$(bun pm view picomatch version)" != "4.0.7" ]; then
            echo "A new picomatch release is available; update dependencies and reassess GHSA-fc5q-39xc-vjpf."
            exit 1
          fi
          bun audit --ignore GHSA-fc5q-39xc-vjpf
      - run: bun run fmt:check
      - run: bun test --reporter=dots
      - run: bun run build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build --file docker/Dockerfile --tag gogoclaw:ci .
      - run: docker run --rm --entrypoint /usr/local/bin/gogoclaw gogoclaw:ci --help
      - run: bash scripts/test-container-port-refresh.sh
      - run: bash scripts/test-container-restart-script.sh
      - run: bash scripts/test-container-restart.sh

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun add --global playwright@1.64.1 axe-core@4.11.0
      - run: '"$(bun pm bin -g)/playwright" install --with-deps chromium'
      - name: Exercise console workflows in Chromium
        run: |
          bun run dev --host 127.0.0.1 > /tmp/gogoclaw-vite.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          timeout 60 bash -c 'until curl -fsS http://127.0.0.1:5173/ >/dev/null; do sleep 1; done'
          export PLAYWRIGHT_MODULE="$(bun pm bin -g)/../install/global/node_modules/playwright"
          export AXE_MODULE="$(bun pm bin -g)/../install/global/node_modules/axe-core/axe.min.js"
          bun ./scripts/browser-smoke.cjs
          GOGOCLAW_BROWSER=chromium bun ./scripts/browser-console-smoke.cjs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Exercise browser against real launcher
        run: |
          bun run build:backend
          cd ../..
          mkdir -p build
          go build -tags goolm,stdjson -o build/browser-cli ./cmd/gogoclaw
          go build -tags goolm,stdjson -o build/browser-launcher ./web/backend
          cd web/frontend
          PLAYWRIGHT_MODULE="$(bun pm bin -g)/../install/global/node_modules/playwright" \
            GOGOCLAW_TEST_CLI="$GITHUB_WORKSPACE/build/browser-cli" \
            GOGOCLAW_TEST_LAUNCHER="$GITHUB_WORKSPACE/build/browser-launcher" \
            bun ./scripts/browser-backend-smoke.cjs

  browser-cross-engine:
    name: browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser:
          - firefox
          - webkit
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun add --global playwright@1.64.1 axe-core@4.11.0
      - run: '"$(bun pm bin -g)/playwright" install --with-deps ${{ matrix.browser }}'
      - name: Exercise console workflows
        env:
          GOGOCLAW_BROWSER: ${{ matrix.browser }}
        run: |
          bun run dev --host 127.0.0.1 > /tmp/gogoclaw-vite.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          timeout 60 bash -c 'until curl -fsS http://127.0.0.1:5173/ >/dev/null; do sleep 1; done'
          PLAYWRIGHT_MODULE="$(bun pm bin -g)/../install/global/node_modules/playwright" \
            AXE_MODULE="$(bun pm bin -g)/../install/global/node_modules/axe-core/axe.min.js" \
            bun ./scripts/browser-console-smoke.cjs
