name: picoclaw

x-production-security: &production-security
  user: "10001:10001"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=256m

services:
  picoclaw-gateway:
    image: ${PICOCLAW_IMAGE:-ghcr.io/sipeed/picoclaw:latest}
    profiles: [gateway]
    restart: unless-stopped
    <<: *production-security
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PICOCLAW_GATEWAY_HOST: 0.0.0.0
    ports:
      - "${PICOCLAW_GATEWAY_BIND:-127.0.0.1}:18790:18790"
    volumes:
      - picoclaw-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18790/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  picoclaw-launcher:
    image: ${PICOCLAW_IMAGE:-ghcr.io/sipeed/picoclaw:latest}
    profiles: [launcher]
    restart: unless-stopped
    <<: *production-security
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PICOCLAW_GATEWAY_HOST: 0.0.0.0
    command: ["picoclaw-launcher", "-public", "-no-browser"]
    ports:
      - "${PICOCLAW_LAUNCHER_BIND:-127.0.0.1}:18800:18800"
    volumes:
      - picoclaw-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18800/api/auth/status"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  picoclaw-agent:
    image: ${PICOCLAW_IMAGE:-ghcr.io/sipeed/picoclaw:latest}
    profiles: [agent]
    <<: *production-security
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    command: ["agent"]
    stdin_open: true
    tty: true
    volumes:
      - picoclaw-data:/data

volumes:
  picoclaw-data:
    name: picoclaw-data
