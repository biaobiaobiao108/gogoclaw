name: gogoclaw

x-production-security: &production-security
  user: "10001:10001"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=256m

services:
  gogoclaw-gateway:
    image: ${GOGOCLAW_IMAGE:-ghcr.io/biaobiaobiao108/gogoclaw:latest}
    profiles: [gateway]
    restart: unless-stopped
    <<: *production-security
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      GOGOCLAW_GATEWAY_HOST: 0.0.0.0
    ports:
      - "${GOGOCLAW_GATEWAY_BIND:-127.0.0.1}:18790:18790"
    volumes:
      - gogoclaw-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18790/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  gogoclaw-launcher:
    image: ${GOGOCLAW_IMAGE:-ghcr.io/biaobiaobiao108/gogoclaw:latest}
    profiles: [launcher]
    restart: unless-stopped
    <<: *production-security
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      GOGOCLAW_GATEWAY_HOST: 0.0.0.0
    command: ["gogoclaw-launcher", "-public", "-no-browser"]
    ports:
      - "${GOGOCLAW_LAUNCHER_BIND:-127.0.0.1}:18800:18800"
    volumes:
      - gogoclaw-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18800/api/auth/status"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  gogoclaw-agent:
    image: ${GOGOCLAW_IMAGE:-ghcr.io/biaobiaobiao108/gogoclaw:latest}
    profiles: [agent]
    <<: *production-security
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    command: ["agent"]
    stdin_open: true
    tty: true
    volumes:
      - gogoclaw-data:/data

volumes:
  gogoclaw-data:
    name: gogoclaw-data
