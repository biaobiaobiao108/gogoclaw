name: gogoclaw

# Local development override. Production uses docker-compose.yml without this file.
services:
  gogoclaw-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${GOGOCLAW_IMAGE:-gogoclaw:dev}

  gogoclaw-launcher:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${GOGOCLAW_IMAGE:-gogoclaw:dev}

  gogoclaw-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${GOGOCLAW_IMAGE:-gogoclaw:dev}
